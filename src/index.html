  <script>
    // js: liga as animações. js-abrindo: no celular a seção de serviços (logo abaixo do hero)
    // só é montada depois da primeira pintura, pra as fotos dela não disputarem a banda com
    // a foto do hero (99-desempenho.css). Sai na primeira pintura ou em 2,5 s, o que vier antes.
    (function () {
      var h = document.documentElement
      h.classList.add('js', 'js-abrindo')
      var pronto = function () { h.classList.remove('js-abrindo') }
      try {
        new PerformanceObserver(function (l) { if (l.getEntriesByName('first-contentful-paint').length) pronto() }).observe({ type: 'paint', buffered: true })
      } catch (e) { pronto() }
      setTimeout(pronto, 2500)
    })()
  </script>
